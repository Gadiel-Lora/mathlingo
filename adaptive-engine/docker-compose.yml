version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

  elitemath-backend:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_API_URL=http://ollama:11434
      - DATABASE_URL=postgresql://user:pass@db:5432/elitemath
    volumes:
      - ./src:/app/src

volumes:
  ollama-data:
